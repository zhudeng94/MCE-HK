name: publication-checks
on: [push, pull_request]
jobs:
  data-and-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .
      - run: python -m compileall -q src/cmhk
      - run: cmhk check-results
